[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fruit-market"
version = "0.1.0a0"
description = "Physical AI agent for a single-stall market operator."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Fruit Market" }]
license = { text = "MIT" }

# Runtime dependencies — installed on every machine that runs the app.
# Mac-only vision stack lives under [project.optional-dependencies].vision
# so Linux CI doesn't try to install mlx-vlm.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
    "stripe>=11.1",
    "google-genai>=0.3",
]

[project.optional-dependencies]
# Vision stack — Apple Silicon only.
vision = [
    "mlx-vlm>=0.1.10",
    "opencv-python>=4.10",
]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests",
]

[tool.hatch.build.targets.wheel]
packages = ["fruit_market"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "TCH"]
ignore = ["E501"]  # line length is handled by formatter

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
# Skeleton phase: a couple of intentionally-incomplete stub modules
# would otherwise trip strict mode. Tighten this as real code lands.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["mlx_vlm.*", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "real_model: hits PaliGemma on real hardware; needs FRUITMARKET_RUN_REAL_MODEL=1",
    "real_sponsors: hits live sponsor APIs; needs populated .env",
]
